[tool.poetry]
name = "healthsync"
version = "0.1.0"
description = "HealthSYNC - Patient Health Monitoring Platform with TimescaleDB"
authors = [
    "Eshilama Akalumhe <eshilama.akalumhe@ucalgary.ca>",
    "Lana Hawa  <lana.hawa1@ucalgary.ca>",
    "Nader Naboulsi <nader.Naboulsi@ucalgary.ca>"
]
readme = "README.md"
packages = [{include = "healthsync", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.35"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
pandas = "^2.2.0"
faker = "^33.0.0"
bcrypt = "^4.1.2"
email-validator = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]